services:
  - type: web
    name: acrev360-portal
    runtime: static
    # Static sites have no `plan` field — they're free by default, unlike
    # runtime: docker services (see the backend's own render.yaml). Setting
    # one at all makes Render's Blueprint validation reject the file
    # ("no such plan free for service type web") — confirmed live.
    buildCommand: npm install && npm run build --workspace=apps/portal
    staticPublishPath: ./apps/portal/dist
    envVars:
      - key: NODE_VERSION
        value: 20
      # Points at Scaper20's original backend (acrev360-backend.onrender.com),
      # not this session's own separate -wxu8 deployment — consolidating onto
      # his single backend/database rather than running two. This explicit
      # value wins over packages/api/src/client.ts's own production fallback
      # at build time (Vite inlines env vars, so a change here needs a new
      # deploy, not just a restart). Both his backend's ALLOWED_HOSTS fix and
      # its Render suspension need to be resolved on his side before this
      # actually resolves — see docs/CHANGELOG.md.
      - key: VITE_API_BASE_URL
        value: https://acrev360-backend.onrender.com
    # BrowserRouter (apps/portal/src/main.tsx) needs every path to fall back to
    # index.html, or a hard refresh on e.g. /payers 404s — there's no real file
    # at that path, only client-side routing resolves it.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: acrev360-field
    runtime: static
    buildCommand: npm install && npm run build --workspace=apps/field
    staticPublishPath: ./apps/field/dist
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: VITE_API_BASE_URL
        value: https://acrev360-backend.onrender.com
    # Same SPA-rewrite need as the portal above. Real files (sw.js,
    # manifest.json, hashed assets under /assets/*) are still served directly
    # — Render only falls back to this rewrite when no file exists at the
    # requested path, confirmed live on the portal's own deploy.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
